[package]
name = "shadow-messenger"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
shadow-messenger-core = { path = "../core" }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_8"] }
matrix-sdk = "=0.19.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
zeroize = "1"

[profile.dev]
debug = 0
incremental = false
